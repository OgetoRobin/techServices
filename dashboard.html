<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | Tech &amp; Student Services</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background: white;">

<div id="loader" class="show"><div class="spin"></div><strong>Loading…</strong></div>
<div id="toast"></div>

<!-- Sidebar -->
<button id="menuBtn" aria-label="Menu">☰</button>
<div id="scrim"></div>
<aside id="side">
  <div class="logo">💻 TechHub</div>
  <nav>
    <a href="home.html">🏠 Home</a>
    <a href="services.html">🧰 Services</a>
    <a href="notices.html">📢 Notice Board <em class="dot">5</em></a>
    <a href="request.html">📝 Request Service</a>
    <a href="dashboard.html" class="on">📊 My Dashboard</a>
    <a href="contact.html">📞 Contact</a>
  </nav>
  <div class="side-auth" id="guestBox">
    <a class="btn wa" href="login.html">🔐 Login</a>
    <a class="btn ghost" href="register.html" style="color:#fff;border-color:#fff">✨ Create Account</a>
  </div>
  <div class="side-auth hide" id="userBox">
    <div class="me">👤 <span id="meName"></span></div>
    <button class="btn ghost logout" style="color:#fff;border-color:#fff">🚪 Logout</button>
  </div>
</aside>

<div class="page">
<section class="view active">
<div class="wrap">
<h2>📊 My Dashboard</h2>
<p class="sub" id="dWelcome"></p>
<div class="stats">
  <div class="stat"><b id="sTotal">0</b><span class="note">Requests sent</span></div>
  <div class="stat"><b id="sLast">-</b><span class="note">Last service requested</span></div>
  <div class="stat"><b id="sSince">-</b><span class="note">Member since</span></div>
</div>
<h3>📋 My Requests</h3>
<div id="reqList" class="list"></div>
<div class="actions">
  <a class="btn wa" href="request.html">➕ New Request</a>
  <a class="btn ghost" href="table.html">📢 My Applications</a>
  <button class="btn ghost" id="clearReq">🧹 Clear History</button>

</div>
</div>
</section>

<footer>
  <div class="wrap">© <span id="yr"></span> Tech &amp; Student Services ·</div>
</footer>
</div>

<!-- Popup -->
<div class="modal" id="popup"><div class="box center">
  <div class="pi" id="pIcon"></div><h3 id="pTitle"></h3><p id="pText" class="note"></p>
  <button class="btn wa" data-close style="justify-self:center">OK</button>
</div></div>


<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
