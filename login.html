<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | Tech &amp; Student Services</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="show"><div class="spin"></div><strong>Loading…</strong></div>
<div id="toast"></div>

<!-- Sidebar -->
<button id="menuBtn" aria-label="Menu">☰</button>
<div id="scrim"></div>
<aside id="side">
 
  <nav>
    
  </nav>
  <div class="side-auth" id="guestBox">
    <a class="btn wa" href="login.html">🔐 Login</a>
    <a class="btn ghost" href="register.html" style="color:#fff;border-color:#fff">✨ Create Account</a>
  </div>
  <div class="side-auth hide" id="userBox">
    <div class="me">👤 <span id="meName"></span></div>
    <button class="btn ghost logout" style="color:#fff;border-color:#fff">🚪 Logout</button>
  </div>
</aside>

<div class="page">
<section class="view active">
<div class="wrap narrow">

<form id="loginForm" class="authform">
  <h3>🔐 Login</h3>
<p class="sub">Welcome back. Log in to see your dashboard and requests.</p>
  <div><label for="lEmail">Email</label><input id="lEmail" type="email" required></div>
  <div><label for="lPass">Password</label><input id="lPass" type="password" required></div>
  <button class="btn wa" type="submit">Login</button>
  <p class="note">No account? <a href="register.html">Create one</a></p>
</form>
</div>
</section>

<footer>
  <div class="wrap">© <span id="yr"></span> </div>
</footer>
</div>

<!-- Popup -->
<div class="modal" id="popup"><div class="box center">
  <div class="pi" id="pIcon"></div><h3 id="pTitle"></h3><p id="pText" class="note"></p>
  <button class="btn wa" data-close style="justify-self:center">OK</button>
</div></div>

<a class="btn wa float" target="_blank" rel="noopener" href="https://wa.me/254700000000?text=Hello%2C%20I%20would%20like%20to%20inquire%20about%20your%20services.">💬 WhatsApp</a>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
