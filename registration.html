<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration </title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
   <div class="card">
<form action="">
<h2>Account Registration</h2>
<p>Join the squad</p>
<div class="inputs">
    <label for="">Enter your Username</label>
    <input type="text" id="username" placeholder="staff@trp.ac.ke">
</div>

<div class="inputs">
    <label for="">UNI number</label>
    <input type="text" id="number" placeholder="eg UHG453/O26">
</div>

<div class="inputs">
    <label for="">Password</label>
    <input type="password" id="password" placeholder="password">
</div>

<div class="inputs">
    <label for="">Confirm Password</label>
    <input type="password" id="cpassword" placeholder="Confirm">
</div>
<button type="submit">Create Account</button>
<div class="link"><a href="">Forget Password</a></div>
<hr>

<div class="acc">Already have an Account?<a href="">Login</a></div>

</form>
<script src="login.js"></script>
   </div> 
</body>
</html>
